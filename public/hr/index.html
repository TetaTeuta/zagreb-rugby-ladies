<!DOCTYPE html>
<html lang="hr">
    <head>
        <meta charset="UTF-8" />

        <!-- Hreflang annotations for multilingual SEO -->
        <link
            rel="alternate"
            hreflang="en"
            href="https://www.zagreb-rugby-ladies.eu/"
        />
        <link
            rel="alternate"
            hreflang="hr"
            href="https://www.zagreb-rugby-ladies.eu/hr/"
        />
        <link
            rel="alternate"
            hreflang="x-default"
            href="https://www.zagreb-rugby-ladies.eu/"
        />

        <!-- Favicon - Multiple formats for better browser compatibility -->
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
        <link rel="shortcut icon" href="/favicon.png" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Default meta tags (will be overridden by react-helmet-async) -->
        <title>
            Zagreb Rugby Ladies | Ženski Ragbi Sedmerac Tim u Zagrebu, Hrvatska
        </title>
        <meta
            name="description"
            content="Pridružite se Zagreb Rugby Ladies, ženskom ragbi sedmerac timu u Zagrebu, Hrvatska. Naučite ragbi, budite u formi i postanite dio osnažujuće zajednice. Nije potrebno iskustvo!"
        />
        <meta
            name="keywords"
            content="ženski ragbi, ragbi Zagreb, ragbi Hrvatska, ragbi sedam, ženski sport, ragbi tim, ragbi pravila, ragbi osnove, nauči ragbi"
        />

        <!-- Open Graph default tags -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Zagreb Rugby Ladies" />
        <meta property="og:locale" content="hr_HR" />
        <meta property="og:locale:alternate" content="en_US" />

        <!-- Twitter Card default tags -->
        <meta name="twitter:card" content="summary_large_image" />

        <!-- Preconnect to improve performance -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Theme color for mobile browsers -->
        <meta name="theme-color" content="#1e3a5f" />

        <!-- Robots meta -->
        <meta name="robots" content="index, follow, max-image-preview:large" />

        <!-- Force HTTPS and upgrade insecure requests -->
        <meta
            http-equiv="Content-Security-Policy"
            content="upgrade-insecure-requests"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
